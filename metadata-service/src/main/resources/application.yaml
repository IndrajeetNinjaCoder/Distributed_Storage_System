server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: metadata-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/DFS}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:yourpassword}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

presigned:
  secret-key: ${PRESIGNED_SECRET:my-dev-secret-change-in-production}

internal:
  running-in-docker: ${RUNNING_IN_DOCKER:false}